name: ServerIntegrationwithDicord
main: pl.karpik122.serverIntegrationwithDicord.Spigot.MainSpigot
version: ${version}
api-version: 1.21
author: karpik122
prefix: ServerIntegrationwithDicord
description: Plugin for minecraft server
commands:
  report:
    description: Report user


  link:
    description: Generuje kod do Discorda

  discordintegration:
    permission: serverintegrationwithdicord.admin

    reload:
      permission: serverintegrationwithdicord.admin

    log:
      permission: serverintegrationwithdicord.admin
    report:
      permission: serverintegrationwithdicord.admin
    token:
      permission: serverintegrationwithdicord.admin

permissions:
  serverintegrationwithdicord:
    admin:
      default: true
    user:
      default: false


libraries:
  - net.dv8tion:JDA:6.4.1
  - org.bstats:bstats-bukkit:3.2.1