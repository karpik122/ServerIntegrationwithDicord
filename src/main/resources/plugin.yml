name: ServerIntegrationwithDicord
main: pl.karpik122.serverIntegrationwithDicord.Spigot.MainSpigot
version: ${version}
api-version: 1.21
author: karpik122
prefix: ServerIntegrationwithDicord
description: Integracja serwera Minecraft z Discordem przez JDA.
softdepend: [Vault]
# Spigot/Paper pobierze JDA z Maven Central przy pierwszym uruchomieniu.
# Biblioteka nie jest pakowana do pliku JAR pluginu.
libraries:
  - net.dv8tion:JDA:6.4.1
commands:
  report:
    description: Zgłasza gracza na skonfigurowany kanał Discord.
    usage: /report <gracz> <powód>
    permission: serverintegrationwithdicord.report
  link:
    description: Generuje jednorazowy kod połączenia konta.
    usage: /link
    permission: serverintegrationwithdicord.link
  discordintegration:
    aliases: [di]
    description: Zarządza integracją Discord i pokazuje diagnostykę.
    usage: /discordintegration <reload|health|set|past>
    permission: serverintegrationwithdicord.admin

permissions:
  serverintegrationwithdicord.admin:
    description: Pozwala zarządzać integracją Discord.
    default: op
  serverintegrationwithdicord.report:
    description: Pozwala korzystać z /report.
    default: true
  serverintegrationwithdicord.link:
    description: Pozwala korzystać z /link.
    default: true
