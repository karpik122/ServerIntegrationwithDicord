# Token bota Discord. Nigdy nie publikuj pliku z prawdziwym tokenem.
TOKEN: ""

# Identyfikatory Discord (włącz tryb deweloperski w kliencie Discord, aby je skopiować).
report_channel: ""
id_log_channel: ""
guildID: ""

# pl-PL, en-US
language: "pl-PL"

# Dodatkowe logi diagnostyczne w konsoli.
debug: false

# Sprawdzanie nowej wersji przez zewnętrzne API CurseForge.
check_for_updates: false

# Ważność kodu z /link oraz ograniczenie spamu /report.
link_code_ttl_minutes: 10
report_cooldown_seconds: 30

# Logowanie komend. Nazwy podawaj bez ukośnika.
command_log:
  enabled: true
  excluded_commands:
    - login
    - l
    - log
    - register
    - reg
    - changepassword
    - changepass
    - cp
    - discordintegration
    - di
    - report

# Przyciski ban/kick pod zgłoszeniami i alertami.
discordadmininteraction: false

# ID ról Discord uprawnionych do przycisków administracyjnych.
admindiscordid: []

# Alertowanie o wskazanych słowach na kanale logów.
flag: false
flagwords:
  - "przykładowe niedozwolone słowo"
